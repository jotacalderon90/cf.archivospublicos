<!--use:main-->

<!--define:head-->
	<link rel="stylesheet" href="filemanager/_.css" />
<!--/define:head-->

<!--define:script-->

	<script src="filemanager/_.js"></script>
	
<!--/define:script-->

<!--define:main-->

	<!--include:filemanager/section/nav-->
	
	<div class="container-fluid">
		<div class="row">
			<aside class="border border-right col-md-3 col-lg-2 bg-body-tertiary min-vh-100 offcanvas-md offcanvas-end" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
				<ul id="ul_directory" class="mt-4"></ul>
			</aside>
			<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" v-show="filemanager.archive!=null">
				<div class="btn-group btn-group-sm mt-4">
					<a class="btn btn-outline-primary" target="_blank" title="Descargar" v-show="filemanager.isFile" :href="filemanager.fullnameDOWNLOAD" >
						<i class="fa fa-download"></i> Descargar
					</a>
					<a class="btn btn-outline-primary" target="_blank" title="Visualizar" v-show="filemanager.isFile" :href="filemanager.fullnameGET" >
						<i class="fa fa-eye"></i> Visualizar
					</a>
					<button class="btn btn-outline-primary" v-on:click="filemanager.close()" title="Cerrar">
						<i class="fa fa-close"></i> Cerrar
					</button>
				</div>
				<br>
				<br>
				<div v-show="filemanager.isFile">
					<textarea rows="15" class="form-control" v-show="filemanager.isTextFile" v-model="filemanager.fileContent"></textarea>
					<div class="panel-body dv-visualcontent" v-show="filemanager.isMediaFile"></div>
				</div>	
			</main>
		</div>
	</div>

<!--/define:main-->
