
services:

  archivospublicos:
    build:
      context: .
      target: prod
    image: archivospublicos:0.0.1
    container_name: archivospublicos
    restart: unless-stopped
    mem_limit: 128M
    mem_reservation: 64M
    env_file:
      - .env.production
    volumes:
      - /var/log/trascender/archivospublicos:/srv/cf.archivospublicos/logs
    environment:
      NODE_ENV: "production"
      PORT: 2201
    ports:
      - "127.0.0.1:2201:2201"